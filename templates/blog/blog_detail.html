{% extends "base.html" %}

{% load static %}


{% block title %}
    Story — Lumiscript
{% endblock %}


{% block extra_css %}

<link
    rel="stylesheet"
    href="{% static 'css/post_detail.css' %}"
>

{% endblock %}


{% block content %}

<main class="blog-detail-page">

    <div class="blog-detail-container">


        <!-- =========================================
             LOADING
        ========================================== -->

        <div
            id="detailLoading"
            class="detail-loading"
        >

            <i class='bx bx-loader-alt bx-spin'></i>

            <p>
                Loading story...
            </p>

        </div>


        <!-- =========================================
             ERROR
        ========================================== -->

        <div
            id="detailError"
            class="detail-error"
            style="display: none;"
        >

            <i class='bx bx-error-circle'></i>

            <h2>
                Unable to load this story.
            </h2>

            <a
                href="{% url 'blog' %}"
            >
                Back to stories
            </a>

        </div>


        <!-- =========================================
             ARTICLE
        ========================================== -->

        <article
            id="blogDetail"
            class="blog-detail"
            style="display: none;"
        >


            <!-- =====================================
                 ARTICLE HEADER
            ====================================== -->

            <header class="article-header">


                <!-- CATEGORY -->

                <div
                    id="articleCategory"
                    class="article-category"
                >
                </div>


                <!-- TITLE -->

                <h1
                    id="articleTitle"
                    class="article-title"
                >
                </h1>


                <!-- EXCERPT -->

                <p
                    id="articleExcerpt"
                    class="article-excerpt"
                >
                </p>


                <!-- META -->

                <div
                    class="article-meta"
                >


                    <!-- AUTHOR -->

                    <span
                        id="articleAuthor"
                    >
                    </span>


                    <span
                        class="meta-separator"
                    >
                        ·
                    </span>


                    <!-- DATE -->

                    <span
                        id="articleDate"
                    >
                    </span>


                    <span
                        class="meta-separator"
                    >
                        ·
                    </span>


                    <!-- VIEWS -->

                    <span
                        class="article-views"
                    >

                        <i
                            class='bx bx-show'
                        ></i>

                        <span
                            id="articleViews"
                        >
                            0
                        </span>

                        views

                    </span>


                    <!-- LIKE -->

                    <button
                        type="button"
                        id="likeButton"
                        class="article-like-button"
                    >

                        <i
                            class='bx bx-heart'
                        ></i>

                        <span
                            id="likeCount"
                        >
                            0
                        </span>

                    </button>

                    <button
                        type="button"
                        id="bookmarkButton"
                        class="article-bookmark-button"
                    >

                        <i class='bx bx-bookmark'></i>

                        <span id="bookmarkText">
                            Save
                        </span>

                    </button>


                </div>

            </header>


            <!-- =====================================
                 FEATURED IMAGE
            ====================================== -->

            <div
                id="articleImageWrapper"
                class="article-image-wrapper"
            >
            </div>


            <!-- =====================================
                 ARTICLE CONTENT
            ====================================== -->

            <div
                id="articleContent"
                class="article-content"
            >
            </div>


            <!-- =====================================
                 TAGS
            ====================================== -->

            <div
                id="articleTags"
                class="article-tags"
            >
            </div>


            <!-- =====================================
                 ARTICLE FOOTER
            ====================================== -->

            <footer
                class="article-footer"
            >

                <a
                    href="{% url 'blog' %}"
                    class="back-to-blog"
                >

                    <i
                        class='bx bx-left-arrow-alt'
                    ></i>

                    Back to stories

                </a>

            </footer>


        </article>

    </div>

</main>

{% endblock %}


{% block extra_js %}

<script
    src="{% static 'js/post_detail.js' %}"
></script>

{% endblock %}
