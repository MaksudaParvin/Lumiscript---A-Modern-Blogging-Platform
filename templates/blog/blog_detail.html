{% extends "base.html" %}

{% load static %}


{% block title %}
    Story — Lumiscript
{% endblock %}


{% block extra_css %}

<link
    rel="stylesheet"
    href="{% static 'css/post_detail.css' %}"
>

{% endblock %}


{% block content %}

<main class="blog-detail-page">

    <div class="blog-detail-container">

        <!-- Loading -->

        <div
            id="detailLoading"
            class="detail-loading"
        >

            <i class='bx bx-loader-alt bx-spin'></i>

            <p>
                Loading story...
            </p>

        </div>


        <!-- Error -->

        <div
            id="detailError"
            class="detail-error"
            style="display: none;"
        >

            <i class='bx bx-error-circle'></i>

            <h2>
                Unable to load this story.
            </h2>

            <a href="{% url 'blog' %}">
                Back to stories
            </a>

        </div>


        <!-- Article -->

        <article
            id="blogDetail"
            class="blog-detail"
            style="display: none;"
        >

            <!-- HEADER -->

            <header class="article-header">

                <div
                    id="articleCategory"
                    class="article-category"
                >
                </div>


                <h1
                    id="articleTitle"
                    class="article-title"
                >
                </h1>


                <p
                    id="articleExcerpt"
                    class="article-excerpt"
                >
                </p>


                <div
                    class="article-meta"
                >

                    <span
                        id="articleAuthor"
                    >
                    </span>


                    <span class="meta-separator">
                        ·
                    </span>


                    <span
                        id="articleDate"
                    >
                    </span>


                    <span class="meta-separator">
                        ·
                    </span>


                    <span>

                        <i class='bx bx-show'></i>

                        <span
                            id="articleViews"
                        >
                            0
                        </span>

                        views

                    </span>

                </div>

            </header>


            <!-- FEATURED IMAGE -->

            <div
                id="articleImageWrapper"
                class="article-image-wrapper"
            >

            </div>


            <!-- CONTENT -->

            <div
                id="articleContent"
                class="article-content"
            >
            </div>


            <!-- TAGS -->

            <div
                id="articleTags"
                class="article-tags"
            >
            </div>


            <!-- BACK -->

            <div class="article-footer">

                <a
                    href="{% url 'blog' %}"
                    class="back-to-blog"
                >

                    <i class='bx bx-left-arrow-alt'></i>

                    Back to stories

                </a>

            </div>

        </article>

    </div>

</main>

{% endblock %}


{% block extra_js %}

<script
    src="{% static 'js/post_detail.js' %}"
></script>

{% endblock %}
